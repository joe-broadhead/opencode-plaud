name: Bug report
description: Something the plugin does wrong.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not put a credential, a token, a signed audio link or a person's recordings in an issue. Report a
        vulnerability through the process in SECURITY.md.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version in package.json, or the release tag you installed.
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: The release `status` reports, such as 2.4.1.
      placeholder: "2.4.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: 'The method (status, probe, events_list, recent, plan_export or export), what you expected, and what the plugin answered. Paste the error''s `CODE: … Next step: …` line.'
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: The check result
      description: Paste `plugin-kit check` if you can run it.
      render: shell
    validations:
      required: false
